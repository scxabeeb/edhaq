name: edhaq_mobile
description: "eDhaq Laundry customer & driver mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  retrofit: 4.4.1

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # JSON serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Routing
  go_router: ^14.2.7

  # UI helpers
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  image_picker: ^1.1.2

  # Functional programming
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Location / maps (optional, for driver tracking)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Utilities
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  freezed: 2.4.7
  retrofit_generator: 8.1.0
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/icons/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: fonts/Inter-Regular.ttf
